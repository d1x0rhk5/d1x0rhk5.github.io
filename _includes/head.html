<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% if page.title and page.url != "/" and page.url != "/index.html" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
	<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta name="theme-color" content="#f4f6f8">
	
	<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
	<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
	<link rel="icon" type="image/png" href="{{ "/static/img/crong-avatar.png" | prepend: site.baseurl }}">
	<link rel="apple-touch-icon" href="{{ "/static/img/crong-avatar.png" | prepend: site.baseurl }}">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script>
		(function () {
			var savedTheme = null;
			try { savedTheme = localStorage.getItem('theme'); } catch (error) {}
			var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<link rel="stylesheet" type="text/css" href="{{ "/static/css/index.css" | prepend: site.baseurl }}">
	<script src="{{ "/static/js/highlight.min.js" | prepend: site.baseurl }}"></script>
	<script>hljs.initHighlightingOnLoad();</script>
	<script src="{{ "/static/js/index.js" | prepend: site.baseurl }}" defer></script>
</head>
