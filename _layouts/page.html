---
layout: default
---
<div class="content-shell">
  <section class="article">
    <header class="page-header">
      <p class="section-label">Page</p>
      <h1>{{ page.title }}</h1>
    </header>
    <article class="page-content">
      {{ content }}
    </article>
  </section>

  {% if page.comments != false %}
    <section class="comments-card">
      {% include comments.html %}
    </section>
  {% endif %}
</div>
